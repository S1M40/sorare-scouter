services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scoutlab_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - PROJECT_NAME=ScoutLab API
      - API_V1_STR=/api/v1
      - SECRET_KEY=production-secret-key-change-in-env-min-32-chars
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:8080","https://lovable.dev"]
      - DATABASE_URL=postgresql+asyncpg://scoutlab:scoutlab_secret@postgres:5432/scoutlab
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
      - SORARE_GRAPHQL_URL=https://api.sorare.com/federation/graphql
      - SORARE_WS_URL=wss://ws.sorare.com/cable
      - SORARE_API_KEY=${SORARE_API_KEY:-}
      - SORARE_JWT=${SORARE_JWT:-}
      - SYNC_INTERVAL_MINUTES=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scoutlab_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scoutlab_worker
    restart: unless-stopped
    command: ["python", "-c", "import asyncio; from app.workers.sync_worker import sync_worker; from app.workers.websocket_worker import start_websocket_worker; asyncio.run(sync_worker.start()); asyncio.run(start_websocket_worker()); asyncio.get_event_loop().run_forever()"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://scoutlab:scoutlab_secret@postgres:5432/scoutlab
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
      - SORARE_GRAPHQL_URL=https://api.sorare.com/federation/graphql
      - SORARE_WS_URL=wss://ws.sorare.com/cable
      - SORARE_API_KEY=${SORARE_API_KEY:-}
      - SORARE_JWT=${SORARE_JWT:-}
      - SYNC_INTERVAL_MINUTES=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scoutlab_network

  postgres:
    image: postgres:16-alpine
    container_name: scoutlab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoutlab
      POSTGRES_PASSWORD: scoutlab_secret
      POSTGRES_DB: scoutlab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutlab -d scoutlab"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scoutlab_network

  redis:
    image: redis:7-alpine
    container_name: scoutlab_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scoutlab_network

volumes:
  postgres_data:
  redis_data:

networks:
  scoutlab_network:
    driver: bridge
